<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Black Beiger ERP</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap');
  :root{
    --bb-black:#14293F; --bb-black-soft:#1D3A57; --bb-brass:#2E6FE0; --bb-sage:#3F7250; --bb-rust:#C0392B;
    --bb-line:#CBD8E8; --bb-bg:#F2F6FC; --bb-ink:#16233A; --bb-ink-muted:#5B6B85; --bb-ink-faint:#94A6C2; --bb-surface:#FFFFFF;
    --bb-teal:#0D9488; --bb-purple:#7C3AED; --bb-amber:#B45309;
    --shadow: 0 1px 2px rgba(16,20,30,0.05), 0 1px 10px rgba(16,20,30,0.06);
    --radius: 10px;
    font-family:'Inter',-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bb-bg); color:var(--bb-ink); font-size:14.5px; overflow-x:hidden;}
  .table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch; margin-bottom:10px;}
  .table-scroll table{margin-bottom:0; min-width:520px;}
  .mono{font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums;}

  /* ---- login screen ---- */
  .login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  .card{background:#fff; border:1px solid var(--bb-line); border-radius:12px; padding:32px 28px; width:100%; max-width:360px; box-shadow:var(--shadow);}
  .brand-solo{font-family:Georgia,serif; font-size:19px; text-align:center; margin-bottom:24px;}
  .brand-solo span{color:var(--bb-brass);}
  label{display:block; font-size:10.5px; font-weight:700; color:var(--bb-ink-muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:0.04em;}
  input,select{width:100%; padding:10px 11px; border:1.5px solid var(--bb-line); border-radius:8px; font-size:16px; margin-bottom:14px; font-family:inherit; background:#fff;}
  .btn{padding:11px 16px; border-radius:9px; border:none; font-size:13px; font-weight:700; min-height:44px; cursor:pointer;}
  .btn-block{display:block; width:100%; text-align:center;}
  .btn-primary{background:var(--bb-black); color:#F3EEE2;}
  .btn-secondary{background:transparent; border:1.5px solid var(--bb-black); color:var(--bb-black);}
  .btn:disabled{opacity:0.6; cursor:default;}
  .error{background:#FCF3F1; border-left:3px solid var(--bb-rust); color:var(--bb-rust); font-size:12.5px; padding:10px 12px; border-radius:7px; margin-bottom:14px; display:none;}
  .error.show{display:block;}

  /* ---- app shell ---- */
  .app-shell{display:flex; align-items:flex-start; min-height:100vh;}
  .sidebar{width:210px; flex-shrink:0; background:var(--bb-black); min-height:100vh; padding:18px 0; position:sticky; top:0; display:flex; flex-direction:column; justify-content:space-between;}
  .sidebar-brand{color:#F3EEE2; font-family:Georgia,serif; font-size:15px; padding:0 18px 16px;}
  .sidebar-brand span{color:var(--bb-brass);}
  .sidebar-group{margin-bottom:12px;}
  .sidebar-group-label{color:#7A7365; font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.07em; padding:0 18px 5px;}
  .sidebar-link{display:block; color:#C9BFA6; text-decoration:none; font-size:13px; padding:8px 18px; border-left:2px solid transparent; cursor:pointer;}
  .sidebar-link:hover{color:#fff; background:rgba(255,255,255,0.04);}
  .sidebar-link.active{color:#fff; background:rgba(176,141,87,0.14); border-left:2px solid var(--bb-brass); font-weight:600;}
  .sidebar-foot{padding:14px 18px; border-top:1px solid rgba(255,255,255,0.08);}
  .sidebar-foot .who{color:#F3EEE2; font-size:12.5px; font-weight:600;}
  .sidebar-foot .role{color:#9A917C; font-size:10.5px; text-transform:uppercase; margin-bottom:8px;}
  .sidebar-foot button{width:100%; border:1px solid rgba(255,255,255,0.15); background:transparent; color:#C9BFA6; border-radius:7px; padding:6px; font-size:11.5px; cursor:pointer;}
  .main-content{flex:1; min-width:0;}
  .wrap{max-width:1000px; margin:0 auto; padding:20px 22px 60px;}
  .panel{display:none;}
  .panel.active{display:block;}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .mobile-topbar{display:none; align-items:center; gap:12px; padding:12px 16px; background:var(--bb-black); position:sticky; top:0; z-index:120;}
  .hamburger-btn{background:transparent; border:1px solid rgba(255,255,255,0.2); color:#F3EEE2; border-radius:7px; width:38px; height:38px; font-size:17px; cursor:pointer; flex-shrink:0;}
  .mobile-topbar-brand{color:#F3EEE2; font-family:Georgia,serif; font-size:15px;}
  .mobile-topbar-brand span{color:var(--bb-brass);}
  .sidebar-backdrop{display:none;}
  .card2{background:var(--bb-surface); border:1px solid var(--bb-line); border-radius:var(--radius); padding:17px; margin-bottom:14px; box-shadow:var(--shadow);}
  .card2 h3{margin:0 0 12px; font-family:Georgia,serif; font-size:16px;}
  .card2 h4{margin:14px 0 8px; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--bb-ink-muted); font-weight:700;}
  .subtabs{display:flex; gap:6px; margin-bottom:14px;}
  .subtab{border:1px solid var(--bb-line); background:#fff; color:var(--bb-ink-muted); font-size:11.5px; font-weight:700; padding:9px 14px; border-radius:8px; cursor:pointer; text-transform:uppercase; letter-spacing:0.03em;}
  .subtab.active{background:var(--bb-black); color:#F3EEE2; border-color:var(--bb-black);}
  table{width:100%; border-collapse:collapse; margin-bottom:10px; background:#fff; border-radius:9px; overflow:hidden;}
  th{font-size:9.5px; text-transform:uppercase; color:var(--bb-ink-muted); text-align:left; padding:7px 8px; border-bottom:1px solid var(--bb-line); background:#FAFBFC;}
  td{font-size:12.5px; padding:7px 8px; border-bottom:1px solid var(--bb-line); color:var(--bb-ink);}
  tr:last-child td{border-bottom:none;}
  .badge{font-size:10px; font-weight:700; padding:4px 9px; border-radius:999px;}
  .badge.stock{background:#EAE2CC; color:var(--bb-black);}
  .badge.materials{background:#F0E4D8; color:var(--bb-brass);}
  .badge.open{background:#F5DFD6; color:var(--bb-rust);}
  .badge.resolved{background:#E2E9DD; color:var(--bb-sage);}
  .list-item{border:1px solid var(--bb-line); border-radius:10px; padding:12px 14px; margin-bottom:9px;}
  .list-item .top{display:flex; justify-content:space-between; align-items:center;}
  .list-item .meta{font-size:11.5px; color:var(--bb-ink-muted); margin-top:3px;}
  .variance{font-weight:700; font-family:'IBM Plex Mono', monospace;}
  .variance.zero{color:var(--bb-sage);}
  .variance.nonzero{color:var(--bb-rust);}
  .stat-row{display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
  .stat{flex:1; min-width:110px; background:#fff; border-radius:var(--radius); padding:13px; box-shadow:var(--shadow); border-left:3px solid var(--bb-ink-faint);}
  .stat.accent{border-left-color:var(--bb-brass);}
  .stat.warn{border-left-color:var(--bb-rust);}
  .stat .n{font-family:'IBM Plex Mono', monospace; font-size:22px; font-weight:600;}
  .stat .l{font-size:10px; color:var(--bb-ink-muted); text-transform:uppercase; letter-spacing:0.04em;}
  .empty{color:var(--bb-ink-faint); font-size:12.5px; padding:8px 0;}
  .ledger-summary{display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap;}
  .ledger-summary .box{flex:1; min-width:110px; background:var(--bb-bg); border:1px solid var(--bb-line); border-left:3px solid var(--bb-brass); border-radius:9px; padding:10px 12px;}
  .ledger-summary .box .v{font-family:'IBM Plex Mono', monospace; font-size:17px; font-weight:600;}
  .ledger-summary .box .k{font-size:10px; color:var(--bb-ink-muted); text-transform:uppercase;}
  .filter-row{display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap;}
  .fchip{border:1px solid var(--bb-line); background:#fff; border-radius:999px; padding:6px 12px; font-size:11px; font-weight:600; cursor:pointer;}
  .fchip.active{background:var(--bb-black); color:#F3EEE2; border-color:var(--bb-black);}
  .coming-soon{text-align:center; padding:60px 20px; color:var(--bb-ink-faint);}
  .loading{text-align:center; padding:40px; color:var(--bb-ink-muted); font-size:13px;}
  .sku-dropdown{position:absolute; top:100%; left:0; right:0; background:#fff; border:1px solid var(--bb-line); border-radius:8px; box-shadow:var(--shadow); z-index:50; max-height:170px; overflow-y:auto; margin-top:2px;}
  .sku-suggestion{padding:9px 12px; font-size:13px; cursor:pointer;}
  .sku-suggestion:hover{background:var(--bb-bg);}
  .focused-header{display:none; align-items:center; justify-content:space-between; padding:14px 16px; background:var(--bb-black); position:sticky; top:0; z-index:100;}
  .focused-signout{background:transparent; border:1px solid rgba(255,255,255,0.2); color:#C9BFA6; border-radius:7px; padding:7px 12px; font-size:11.5px; cursor:pointer;}
  .modal-backdrop{display:none; position:fixed; inset:0; background:rgba(16,20,30,0.55); z-index:300; align-items:center; justify-content:center; padding:16px;}
  .modal-backdrop.open{display:flex;}
  .modal-box{background:#fff; border-radius:12px; max-width:420px; width:100%; max-height:82vh; overflow-y:auto; padding:20px;}
  .modal-box h3{margin:0 0 12px; font-family:Georgia,serif; font-size:17px;}
  .modal-actions{display:flex; gap:8px; margin-top:16px;}
  .modal-total{font-family:'IBM Plex Mono', monospace; font-size:15px; font-weight:700; text-align:right; padding-top:8px; border-top:1px solid var(--bb-line); margin-top:6px;}
  .icon-btn{background:#fff; border:1px solid var(--bb-line); border-radius:6px; padding:6px 9px; font-size:11.5px; line-height:1; cursor:pointer; color:var(--bb-ink-muted); flex-shrink:0; white-space:nowrap;}
  .icon-btn-delete{background:#fff; border:1.5px solid var(--bb-rust); border-radius:8px; width:38px; height:38px; padding:0; display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer; color:var(--bb-rust); flex-shrink:0; font-weight:700; box-sizing:border-box;}
  .icon-btn-delete:hover{background:#FCF1EF;}
  .card2.accent-log{border-top:3px solid var(--bb-brass);}
  .card2.accent-detail{border-top:3px solid var(--bb-teal); background:#EEF3F7;}
  .card2.accent-bulk{border-top:3px solid var(--bb-purple);}
  .card2.accent-history{border-top:3px solid var(--bb-amber);}
  .dyn-field-label{font-size:13px; text-transform:uppercase; color:var(--bb-ink); font-weight:700; margin-bottom:3px; letter-spacing:0.03em;}
  .rr-code, .rr-qty{height:38px; box-sizing:border-box;}
  .rr-code, .rr-qty{padding:6px 8px !important;}
  .icon-btn:hover{background:var(--bb-bg);}
  .app-shell.force-mobile:not(.focused){display:block !important;}
  .app-shell.force-mobile:not(.focused) .mobile-topbar{display:flex !important;}
  .app-shell.force-mobile:not(.focused) .sidebar{position:fixed !important; top:0 !important; left:0 !important; height:100vh !important; width:82% !important; max-width:300px !important; transform:translateX(-100%) !important; transition:transform 0.22s ease; z-index:200 !important; overflow-y:auto !important;}
  .app-shell.force-mobile:not(.focused) .sidebar.open{transform:translateX(0) !important;}
  .app-shell.force-mobile:not(.focused) .sidebar-backdrop.open{display:block !important; position:fixed !important; inset:0 !important; background:rgba(0,0,0,0.45) !important; z-index:150 !important;}
  .app-shell.force-mobile:not(.focused) .wrap{padding:14px 12px 50px !important;}
  .app-shell.force-mobile:not(.focused) .grid2{grid-template-columns:1fr !important;}
  .app-shell.focused{display:block !important;}
  .app-shell.focused .sidebar, .app-shell.focused .mobile-topbar, .app-shell.focused .sidebar-backdrop{display:none !important;}
  .app-shell.focused .focused-header{display:flex !important;}
  .app-shell.focused .grid2{grid-template-columns:1fr !important;}
  .app-shell.focused .wrap{max-width:600px; padding:14px 12px 50px !important;}
  .app-shell.focused .card2{padding:13px !important;}
  .app-shell.focused input, .app-shell.focused select{margin-bottom:10px !important;}
  .app-shell.focused label{margin-bottom:3px !important;}
  .app-shell.focused .card2 h4{margin:10px 0 6px !important;}
  .app-shell.focused th, .app-shell.focused td{padding:5px 6px !important; font-size:11.5px !important;}
  .app-shell.focused .table-scroll table{min-width:0 !important;}
  .app-shell.focused .icon-btn{padding:4px 7px !important; font-size:10.5px !important;}
  .app-shell.focused .btn-sm{padding:8px 12px !important; font-size:12px !important;}
  .app-shell.focused .badge{font-size:9px !important; padding:3px 7px !important;}
  @media(max-width:820px){
    .grid2{grid-template-columns:1fr;}
    .app-shell{display:block;}
    .mobile-topbar{display:flex;}
    .sidebar{position:fixed; top:0; left:0; height:100vh; width:82%; max-width:300px; transform:translateX(-100%); transition:transform 0.22s ease; z-index:200; overflow-y:auto;}
    .sidebar.open{transform:translateX(0);}
    .sidebar-backdrop.open{display:block; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:150;}
    .wrap{padding:14px 12px 50px;}
    .card2{padding:13px;}
    input,select{margin-bottom:10px;}
    label{margin-bottom:3px;}
    .card2 h4{margin:10px 0 6px;}
  }
</style>
</head>
<body>

<div class="login-wrap" id="loginWrap">
  <div class="card">
    <div class="brand-solo">Black Beiger <span>ERP</span></div>
    <div id="loginView">
      <div class="error" id="loginError"></div>
      <label>Email</label>
      <input type="email" id="email" autocomplete="username">
      <label>Password</label>
      <input type="password" id="password" autocomplete="current-password">
      <button class="btn btn-primary btn-block" id="signInBtn" onclick="doSignIn()">Sign In</button>
    </div>
  </div>
</div>

<div class="app-shell" id="appShell" style="display:none;">
  <div class="focused-header" id="focusedHeader">
    <div class="mobile-topbar-brand">Black Beiger <span>ERP</span></div>
    <button class="focused-signout" onclick="doSignOut()">Sign Out</button>
  </div>
  <div class="mobile-topbar" id="mobileTopbar">
    <button class="hamburger-btn" onclick="toggleSidebar()">☰</button>
    <div class="mobile-topbar-brand">Black Beiger <span>ERP</span></div>
  </div>
  <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>
  <aside class="sidebar" id="sidebarEl">
    <div>
      <div class="sidebar-brand">Black Beiger <span>ERP</span></div>
      <div id="sidebarNav"></div>
    </div>
    <div class="sidebar-foot">
      <div class="who" id="footWho"></div>
      <div class="role" id="footRole"></div>
      <button onclick="doSignOut()">Sign Out</button>
    </div>
  </aside>
  <div class="main-content">
    <div class="wrap">
      <div class="panel" id="panel-boy"></div>
      <div class="panel" id="panel-approver"></div>
      <div class="panel active" id="panel-owner"></div>
      <div class="panel" id="panel-discrepancies"></div>
      <div class="panel" id="panel-ledger"></div>
      <div class="panel" id="panel-team"></div>
      <div class="panel" id="panel-exports"></div>
      <div class="panel" id="panel-admin"></div>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://pxshmlzcuboucsqjmwbe.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB4c2htbHpjdWJvdWNzcWptd2JlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4MTk5NTcsImV4cCI6MjEwMzM5NTk1N30.EaeHaJikEDfeFQlbQArn8m_XrIQ6iS2z9kSITavI4bs';

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let me = null;          // { id, full_name, role } from app_users
  let modalConfirmCallback = null;
  // crypto.randomUUID() needs a fairly modern browser and isn't available
  // everywhere — this works identically on any JS engine, old or new.
  function generateUUID(){
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){
      const r = Math.random() * 16 | 0;
      const v = c === 'x' ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });
  }
  // A calm, one-word confirmation instead of a browser alert box that
  // reads like an error to anyone not expecting it.
  let inlineSuccessCallback = null;
  function showInlineSuccess(then){
    inlineSuccessCallback = then;
    const area = document.getElementById('boyFormArea');
    if(area){
      area.innerHTML = `
        <div class="card2" style="text-align:center; padding:34px 20px;">
          <div style="font-size:38px; color:var(--bb-sage); line-height:1;">✓</div>
          <div style="font-size:15px; font-weight:700; color:var(--bb-sage); margin-top:8px; margin-bottom:20px;">Submitted</div>
          <button class="btn btn-primary" onclick="dismissInlineSuccess()">Continue</button>
        </div>
      `;
    }
  }
  function dismissInlineSuccess(){
    const cb = inlineSuccessCallback;
    inlineSuccessCallback = null;
    if(cb) cb();
  }
  function showInfoModal(title, bodyHtml){
    document.getElementById('infoModalTitle').textContent = title;
    document.getElementById('infoModalBody').innerHTML = bodyHtml;
    document.getElementById('infoModalBackdrop').classList.add('open');
  }
  function closeInfoModal(){
    document.getElementById('infoModalBackdrop').classList.remove('open');
  }

  // Click-through from any ledger row back to the original evidence —
  // the photo, who approved it and when, and the SKU breakdown/recount
  // behind that number, so a doubted entry can always be checked.
  async function openLedgerEntryDetail(grnId){
    if(!grnId) return;
    showInfoModal('Loading…', '<div class="loading">Loading…</div>');

    const [{ data: grn, error: eGrn }, { data: approvals }, { data: recvLines }, { data: countedLines }] = await Promise.all([
      sb.from('grn').select('*').eq('id', grnId).single(),
      sb.from('grn_approvals').select('*').eq('grn_id', grnId).order('acted_at', { ascending:true }),
      sb.from('grn_receiving_lines').select('base_item_code, quantity').eq('grn_id', grnId),
      sb.from('grn_counted_lines').select('material_id, counted_quantity').eq('grn_id', grnId),
    ]);
    if(eGrn){ showInfoModal('Error', `<div class="empty">${eGrn.message}</div>`); return; }

    let photoHtml = '<div class="empty">No photo attached.</div>';
    if(grn.slip_photo_url){
      const { data: signed, error: eSign } = await sb.storage.from('receiving-slips').createSignedUrl(grn.slip_photo_url, 3600);
      photoHtml = eSign
        ? `<div class="empty">Could not load photo: ${eSign.message}</div>`
        : `<img src="${signed.signedUrl}" style="width:100%; max-height:280px; object-fit:contain; border-radius:8px; border:1.5px solid var(--bb-line); margin-bottom:12px; background:#000;">`;
    }

    const approvalsHtml = (approvals||[]).length
      ? `<div class="table-scroll"><table><tr><th>Step</th><th>By</th><th>When</th></tr>${approvals.map(a=>`<tr><td>${a.step_number}</td><td>${userName(a.approver_user_id)}</td><td>${fmtDate(a.acted_at)}</td></tr>`).join('')}</table></div>`
      : '<div class="empty">No approval records.</div>';

    const countedTotals = {};
    (countedLines||[]).forEach(l => {
      const mat = refData.materials.find(m => m.id === l.material_id);
      const label = mat ? mat.sku : l.material_id;
      countedTotals[label] = (countedTotals[label]||0) + Number(l.counted_quantity);
    });

    const body = `
      <p style="font-size:12.5px; color:var(--bb-ink-muted); margin-top:0;">${grn.receiving_book_ref||'no bill no'} · ${fmtDate(grn.entry_date || grn.created_at)} · logged by ${userName(grn.created_by)}</p>
      ${photoHtml}
      <h4>Approvals</h4>
      ${approvalsHtml}
      ${(recvLines||[]).length ? `<h4>Receiving Book</h4><div class="table-scroll"><table><tr><th>Code</th><th>Qty</th></tr>${recvLines.map(l=>`<tr><td>${l.base_item_code}</td><td>${l.quantity}</td></tr>`).join('')}</table></div>` : ''}
      ${Object.keys(countedTotals).length ? `<h4>Physical Recount</h4><div class="table-scroll"><table><tr><th>SKU</th><th>Qty</th></tr>${Object.entries(countedTotals).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</table></div>` : ''}
    `;
    showInfoModal(vendorName(grn.vendor_id), body);
  }

  function showConfirmModal(title, bodyHtml, onConfirm, confirmLabel){
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML = bodyHtml;
    document.getElementById('modalConfirmBtn').textContent = confirmLabel || 'Confirm & Submit';
    modalConfirmCallback = onConfirm;
    document.getElementById('modalBackdrop').classList.add('open');
  }
  function closeModal(){
    document.getElementById('modalBackdrop').classList.remove('open');
    modalConfirmCallback = null;
  }
  function confirmModal(){
    const cb = modalConfirmCallback;
    closeModal();
    if(cb) cb();
  }
  let writeInFlight = false;
  let boySub = 'log';
  let receivingRowCount = 0;
  let selectedDetailGrn = null;
  let localCountedLines = [];   // built up locally, written to DB only on Submit
  let currentGrnReceivedQty = {};   // {base_item_code: quantity} for the GRN currently open in Add Details
  let selectedApprovalGrn = null;
  let refData = { vendors: [], materials: [], users: [] };
  let activeTab = 'owner';
  let ledgerView = 'material';
  let discFilter = 'all';

  // ---------- LOGIN ----------
  function showError(msg){
    const el = document.getElementById('loginError');
    el.textContent = msg;
    el.classList.add('show');
  }
  function clearError(){ document.getElementById('loginError').classList.remove('show'); }

  async function doSignIn(){
    clearError();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if(!email || !password){ showError('Enter both email and password.'); return; }
    const btn = document.getElementById('signInBtn');
    btn.disabled = true; btn.textContent = 'Signing in...';

    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if(error){
      showError(error.message === 'Invalid login credentials' ? 'Wrong email or password.' : 'Sign in failed: ' + error.message);
      btn.disabled = false; btn.textContent = 'Sign In';
      return;
    }
    await enterApp(data.user.id);
  }

  async function doSignOut(){
    await sb.auth.signOut();
    me = null;
    const shell = document.getElementById('appShell');
    shell.classList.remove('focused', 'force-mobile');
    shell.style.display = 'none';
    document.getElementById('loginWrap').style.display = 'flex';
    document.getElementById('email').value = '';
    document.getElementById('password').value = '';
    const btn = document.getElementById('signInBtn');
    btn.disabled = false; btn.textContent = 'Sign In';
  }

  // ---------- ROLE-BASED ACCESS ----------
  // Mirrors the database's actual RLS rules — this is a UX convenience
  // (clean "not authorized" message instead of a confusing empty
  // query), not the real security boundary. The real boundary is the
  // RLS policies (migration 12), which block this data even if
  // someone bypasses the UI entirely via the browser console.
  const READY_TABS = ['boy','approver','owner','discrepancies','ledger','admin','exports','team'];
  const ROLE_TABS = {
    warehouse_boy: ['boy'],
    approver: ['approver'],
    owner: ['boy','approver','owner','discrepancies','ledger','team','exports','admin'],
    admin: ['boy','approver','owner','discrepancies','ledger','team','exports','admin'],
  };
  function allowedTabs(){ return (me && ROLE_TABS[me.role]) || []; }

  async function enterApp(authId){
    const { data: profile, error } = await sb.from('app_users').select('id, full_name, role').eq('auth_id', authId).maybeSingle();
    if(error){ showError('Signed in, but could not load your profile: ' + error.message); resetLoginBtn(); return; }
    if(!profile){ showError('Your login works, but no profile is set up for you yet — ask the admin to add you.'); await sb.auth.signOut(); resetLoginBtn(); return; }

    me = profile;
    document.getElementById('loginWrap').style.display = 'none';
    document.getElementById('appShell').style.display = 'flex';
    document.getElementById('footWho').textContent = me.full_name;
    document.getElementById('footRole').textContent = me.role.replace('_',' ');
    const isFocusedRole = me.role === 'warehouse_boy' || me.role === 'approver';
    document.getElementById('appShell').classList.toggle('focused', isFocusedRole);
    applyMobileLayoutClass();

    await loadReferenceData();
    const landing = allowedTabs()[0] || 'boy';
    await switchTab(landing);
  }
  function resetLoginBtn(){
    const btn = document.getElementById('signInBtn');
    btn.disabled = false; btn.textContent = 'Sign In';
  }

    const { data } = await sb.auth.getSession();
    if(data.session){ await enterApp(data.session.user.id); }
  })();

  // The CSS @media(max-width:820px) query doesn't reliably switch on some
  // real devices — confirmed by testing, not assumed. This JS check is a
  // second, independent mechanism for the Owner/Admin sidebar specifically,
  // paired with !important CSS rules so it wins regardless of whether the
  // media query itself is behaving correctly on a given phone/browser.
  function applyMobileLayoutClass(){
    const shell = document.getElementById('appShell');
    if(!shell || !me) return;
    const w = Math.min(window.innerWidth || 9999, document.documentElement.clientWidth || 9999, screen.width || 9999);
    shell.classList.toggle('force-mobile', w <= 820);
  }
  window.addEventListener('resize', applyMobileLayoutClass);

  async function switchTab(id){
    closeSidebar();
    if(!allowedTabs().includes(id)){
      activeTab = id;
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      const el = document.getElementById('panel-'+id);
      el.classList.add('active');
      el.innerHTML = '<div class="card2"><div class="empty">You do not have access to this screen.</div></div>';
      renderTabs();
      return;
    }
    activeTab = id;
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-'+id).classList.add('active');
    renderTabs();
    if(id === 'owner') await renderOwner();
    else if(id === 'ledger') await renderLedger();
    else if(id === 'discrepancies') await renderDiscrepancies();
    else if(id === 'boy') await renderBoy();
    else if(id === 'approver') await renderApprover();
    else if(id === 'admin') await renderAdmin();
    else if(id === 'exports') await renderExports();
    else if(id === 'team') await renderTeamActivity();
    else renderComingSoon(id);
    window.scrollTo({top:0, behavior:'instant'});

  async function runBulkAllocation(){
    const ticked = Array.from(document.querySelectorAll('.bulk-grn-check:checked')).map(el => el.value);
    if(ticked.length === 0){ alert('Tick at least one delivery'); return; }
    const fileInput = document.getElementById('bulkExcelUpload');
    const file = fileInput.files[0];
    if(!file){ alert('Upload the combined Excel file'); return; }

    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const raw = XLSX.utils.sheet_to_json(sheet, { header:1 });
    const excelRows = [];
    for(const row of raw){
      const [codeRaw, sizeRaw, qtyRaw] = row;
      if(!codeRaw || !sizeRaw || qtyRaw === undefined) continue;
      const qty = Number(qtyRaw);
      if(!qty || isNaN(qty)) continue;
      excelRows.push({ code: String(codeRaw).trim().toUpperCase(), size: String(sizeRaw).trim(), qty });
    }
    if(excelRows.length === 0){ alert('No valid rows found in the file'); return; }

    const ticketedGrns = bulkGrns.filter(g => ticked.includes(g.id));
    bulkAllocationResult = allocateBulkExcel(ticketedGrns, excelRows);
    renderBulkPreview(ticketedGrns);
  }

  // FIFO allocation: oldest ticked delivery's book quantity is filled first
  // for each code. A shortfall against the combined book total shows up as
  // a negative variance on the last delivery in the queue for that code; an
  // excess shows up as a positive one — both land in the normal Discrepancy
  // Register afterward, same mechanism as any other GRN.
  function allocateBulkExcel(ticketedGrns, excelRows){
    const pools = {};
    ticketedGrns.forEach(g => {
      Object.keys(g.receivingByCode).forEach(code => {
        if(!pools[code]) pools[code] = [];
        pools[code].push({ grn_id: g.id, remaining: g.receivingByCode[code] });
      });
    });
    const allocations = [];
    const unmatched = [];
    excelRows.forEach(row => {
      const pool = pools[row.code];
      if(!pool || pool.length === 0){ unmatched.push(row); return; }
      let remaining = row.qty;
      while(remaining > 0 && pool.length > 0 && pool[0].remaining > 0){
        const head = pool[0];
        const take = Math.min(remaining, head.remaining);
        allocations.push({ grn_id: head.grn_id, code: row.code, size: row.size, qty: take, isExcess: false });
        head.remaining -= take;
        remaining -= take;
        if(head.remaining <= 0) pool.shift();
      }
      if(remaining > 0){
        const lastGrnForCode = ticketedGrns.filter(g => row.code in g.receivingByCode).slice(-1)[0];
        if(lastGrnForCode){
          allocations.push({ grn_id: lastGrnForCode.id, code: row.code, size: row.size, qty: remaining, isExcess: true });
        } else {
          unmatched.push({ ...row, qty: remaining });
        }
      }
    });
    return { allocations, unmatched };
  }

  function renderBulkPreview(ticketedGrns){
    const { allocations, unmatched } = bulkAllocationResult;
    const totalsByGrnCode = {};
    allocations.forEach(a => {
      const key = a.grn_id + '|' + a.code;
      totalsByGrnCode[key] = (totalsByGrnCode[key]||0) + a.qty;
    });
    const grnSections = ticketedGrns.map(g => {
      const codes = Object.keys(g.receivingByCode);
      const rows = codes.map(code => {
        const book = g.receivingByCode[code];
        const counted = totalsByGrnCode[g.id+'|'+code] || 0;
        const diff = counted - book;
        return `<tr><td>${code}</td><td>${book}</td><td>${counted}</td><td class="variance ${diff===0?'zero':'nonzero'}">${diff>0?'+':''}${diff}</td></tr>`;
      }).join('');
      return `<h4>${vendorName(g.vendor_id)} · ${g.receiving_book_ref||'no bill no'}</h4>
        <div class="table-scroll"><table><tr><th>Code</th><th>Book</th><th>Allocated</th><th>Δ</th></tr>${rows}</table></div>`;
    }).join('');
    const unmatchedHtml = unmatched.length ? `
      <p style="color:var(--bb-rust); font-weight:700; font-size:12px;">Not matched to any ticked delivery — check these codes, or tick more deliveries:</p>
      <ul style="font-size:12.5px; color:var(--bb-rust);">${unmatched.map(u => `<li>${u.code}-${u.size} × ${u.qty}</li>`).join('')}</ul>
    ` : '';
    document.getElementById('bulkPreviewArea').innerHTML = `
      <div class="card2" style="background:var(--bb-bg);">
        <h3>Review before confirming</h3>
        <p class="section-note">Any Δ here becomes a variance flag on that delivery — the Ledger already posted for these and will not change.</p>
        ${grnSections}
        ${unmatchedHtml}
        <button class="btn btn-primary btn-block" id="bulkConfirmBtn" onclick="confirmBulkFinalize()">Confirm &amp; Submit ${ticketedGrns.length} Recount(s)</button>
      </div>
    `;
  }

  async function confirmBulkFinalize(){
    if(writeInFlight) return;
    writeInFlight = true;
    const btn = document.getElementById('bulkConfirmBtn');
    if(btn){ btn.disabled = true; btn.textContent = 'Submitting…'; }
    try{
      const { allocations } = bulkAllocationResult;
      const variantCache = {};
      for(const a of allocations){
        const key = a.code+'-'+a.size;
        if(!(key in variantCache)) variantCache[key] = await getOrCreateVariant(a.code, a.size);
      }
      const rows = allocations.map(a => ({
        grn_id: a.grn_id, material_id: variantCache[a.code+'-'+a.size], counted_quantity: a.qty, entry_method: 'bulk_finalize', entered_by: me.id
      }));
      const { error: e1 } = await sb.from('grn_counted_lines').insert(rows);
      if(e1){ alert('Could not save lines: ' + e1.message); return; }

      const grnIds = Array.from(new Set(allocations.map(a => a.grn_id)));
      const results = [];
      for(const id of grnIds){
        const { error: e2 } = await sb.rpc('submit_recount', { p_grn_id: id, p_submitter_id: me.id });
        results.push({ id, ok: !e2, error: e2 ? e2.message : null });
      }
      const failed = results.filter(r => !r.ok);
      if(failed.length){
        alert('Lines saved, but ' + failed.length + ' recount(s) failed to submit: ' + failed.map(f=>f.error).join('; ') + ' — safe to try Bulk Finalize again for those.');
      } else {
        alert('All ' + grnIds.length + ' recounts submitted for reconciliation.');
      }
      bulkGrns = []; bulkAllocationResult = null;
      boySub = 'log';
      await renderBoy();
    } catch(err) {
      alert('Something went wrong finalizing this batch: ' + err.message + '. Check History before re-entering anything.');
    } finally {
      writeInFlight = false;
      if(btn){ btn.disabled = false; }
    }
  }

  // Downscales to a reasonable max width and re-encodes as JPEG before
  // upload — keeps uploads fast on a warehouse phone connection while
  // staying legible enough to read handwritten quantities back later.
  function handlePhotoSelect(input){
    const file = input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const maxW = 1600;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(blob => {
          pendingPhotoBlob = blob;
          const prev = document.getElementById('photoPreview');
          prev.src = URL.createObjectURL(blob);
          prev.style.display = 'block';
        }, 'image/jpeg', 0.85);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  const SIZE_OPTIONS = ['36','37','38','39','40','41','42'];

  // Looks up an existing stock variant by SKU, or creates it if this exact
  // size of this code has never been scanned before. Uses ON CONFLICT DO
  // NOTHING (not upsert) deliberately — the app only needs to ADD new size
  // variants, never edit existing ones, so it never needs UPDATE privilege.
  async function getOrCreateVariant(baseCode, size){
    const sku = baseCode + '-' + size;
    const existingLocal = refData.materials.find(m => m.sku === sku);
    if(existingLocal) return existingLocal.id;
    const { data: ins, error: e1 } = await sb.from('materials')
      .insert({ category:'stock', sku, base_item_code: baseCode, name: sku })
      .select('id').maybeSingle();
    if(!e1 && ins){
      refData.materials.push({ id: ins.id, category:'stock', sku, base_item_code: baseCode, name: sku });
      return ins.id;
    }
    const { data: existing, error: e2 } = await sb.from('materials').select('*').eq('sku', sku).maybeSingle();
    if(e2 || !existing) throw new Error('Could not resolve variant ' + sku + (e2 ? ': '+e2.message : ''));
    refData.materials.push(existing);
    return existing.id;
  }

  // Live reconciliation, computed entirely client-side as lines are added —
  // this is what surfaces a mismatch to the boy DURING entry rather than
  // only at approval time, which is exactly what caused the earlier
  // LS119/LS278/LS279 confusion.
  function computeCountedByCode(){
    const counted = {};
    localCountedLines.forEach(l => {
      const mat = refData.materials.find(m => m.id === l.material_id);
      const code = mat ? mat.base_item_code : l.label.split('-').slice(0,-1).join('-');
      counted[code] = (counted[code]||0) + Number(l.qty);
    });
    return counted;
  }
  function renderLiveVarianceTable(){
    const codes = Object.keys(currentGrnReceivedQty);
    if(codes.length === 0) return '';
    const counted = computeCountedByCode();
    const rows = codes.map(code => {
      const book = currentGrnReceivedQty[code];
      const cnt = counted[code] || 0;
      const diff = cnt - book;
      return `<tr><td>${code}</td><td>${book}</td><td>${cnt}</td><td class="variance ${diff===0?'zero':'nonzero'}">${diff>0?'+':''}${diff}</td></tr>`;
    }).join('');
    return `<h4>Book vs. Counted So Far</h4><div class="table-scroll"><table><tr><th>Code</th><th>Book</th><th>Counted</th><th>Δ</th></tr>${rows}</table></div>`;
  }

  async function addLocalCountedLine(kind){

      try{

        localCountedLines.push({ material_id: variantId, qty, method: 'scan', label: code + '-' + size });
        renderAddDetailsForm();

  function removeLocalCountedLine(idx){ localCountedLines.splice(idx,1); renderAddDetailsForm(); }

  let pendingBulkExcelData = null;

  async function handleExcelUpload(input, allowedCodes){
    const file = input.files[0];
    if(!file) return;
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array' });

    // Every sheet, one column, no header — one row per physically scanned
    // unit (e.g. 8 rows reading "1155-39" means qty 8, not one row saying
    // qty=8). Tally occurrences across every sheet in the file.
    const skuTally = {};
    wb.SheetNames.forEach(sheetName => {
      const sheet = wb.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(sheet, { header:1 });
      rows.forEach(row => {
        const raw = row[0];
        if(!raw) return;
        const sku = String(raw).trim().toUpperCase();
        if(!/^.+-\d+$/.test(sku)) return;
        skuTally[sku] = (skuTally[sku]||0) + 1;
      });
    });

    if(Object.keys(skuTally).length === 0){ alert('No valid SKU rows found in the file'); input.value=''; return; }

    // Split each tallied SKU into code + size, matching against this
    // delivery's Receiving Book codes. Some exports omit the "LS" prefix
    // on the value itself (e.g. "1155-39" instead of "LS1155-39") — try
    // both forms before giving up on a code.
    const matched = {};
    const unmatched = [];
    Object.entries(skuTally).forEach(([sku, qty]) => {
      const m = sku.match(/^(.+)-(\d+)$/);
      let code = m[1], size = m[2];
      if(!allowedCodes.includes(code) && allowedCodes.includes('LS'+code)) code = 'LS'+code;
      if(!allowedCodes.includes(code)){ unmatched.push({ sku, qty }); return; }
      matched[code+'-'+size] = { code, size, qty };
    });

    if(Object.keys(matched).length === 0){
      alert('None of the SKUs in this file are on this delivery\'s Receiving Book. Check the file, or confirm you picked the right delivery.');
      input.value = '';
      return;
    }

    const summaryByCode = {};
    Object.values(matched).forEach(({code, qty}) => { summaryByCode[code] = (summaryByCode[code]||0) + qty; });
    const grandTotal = Object.values(summaryByCode).reduce((s,q)=>s+q, 0);

    const summaryRows = Object.entries(summaryByCode).map(([code,qty]) =>
      `<div class="list-item" style="cursor:default; padding:8px 12px; margin-bottom:6px;"><div class="top"><span>${code}</span><span class="mono">${qty}</span></div></div>`
    ).join('');
    const unmatchedHtml = unmatched.length ? `
      <p style="color:var(--bb-rust); font-weight:700; font-size:12px; margin-top:10px;">Not on this delivery's Receiving Book — skipped:</p>
      <ul style="font-size:12.5px; color:var(--bb-rust);">${unmatched.map(u=>`<li>${u.sku} × ${u.qty}</li>`).join('')}</ul>
    ` : '';

    pendingBulkExcelData = matched;
    showConfirmModal('Confirm counted quantities', `
      <p style="font-size:11px; text-transform:uppercase; font-weight:700; color:var(--bb-ink-muted); margin-top:0;">Summary</p>
      ${summaryRows}
      <div class="modal-total">Total: ${grandTotal}</div>
      ${unmatchedHtml}
    `, confirmBulkExcelImport);
    input.value = '';
  }

  async function confirmBulkExcelImport(){
    if(!pendingBulkExcelData) return;
    let added = 0;
    const errors = [];
    for(const [sku, { code, size, qty }] of Object.entries(pendingBulkExcelData)){
      try{
        const variantId = await getOrCreateVariant(code, size);
        localCountedLines.push({ material_id: variantId, qty, method:'excel_upload', label: sku });
        added++;
      }catch(err){ errors.push(sku + ' (' + err.message + ')'); }
    }
    pendingBulkExcelData = null;
    if(errors.length) alert('Added ' + added + ' line(s). Errors: ' + errors.join(', '));
    renderAddDetailsForm();
  }

  function submitForApproval(){
    if(localCountedLines.length === 0){ alert('Add at least one line first'); return; }
    const grandTotal = localCountedLines.reduce((s,l) => s + Number(l.qty), 0);
    const rows = localCountedLines.map(l => `<div class="list-item" style="cursor:default; padding:8px 12px; margin-bottom:6px;"><div class="top"><span>${l.label}</span><span class="mono">${l.qty}</span></div></div>`).join('');
    const varianceHtml = Object.keys(currentGrnReceivedQty).length ? renderLiveVarianceTable() : '';
    const hasNonZero = Object.keys(currentGrnReceivedQty).some(code => (computeCountedByCode()[code]||0) !== currentGrnReceivedQty[code]);
    const body = `
      ${rows}
      <div class="modal-total">Grand Total: ${grandTotal}</div>
      ${varianceHtml}
      ${hasNonZero ? '<p style="color:var(--bb-rust); font-size:12px; font-weight:600; margin-bottom:0;">There\'s a difference against the Receiving Book above — check it\'s correct before continuing.</p>' : ''}
    `;
    showConfirmModal('Check before submitting', body, doSubmitForApproval);
  }

  async function doSubmitForApproval(){
    if(writeInFlight) return;
    writeInFlight = true;
    const btn = document.getElementById('submitDetailsBtn');
    if(btn){ btn.disabled = true; btn.textContent = 'Submitting…'; }
    try{
      const { data: grnRow, error: eGrn } = await sb.from('grn').select('status').eq('id', selectedDetailGrn).single();
      if(eGrn){ alert('Could not check delivery status: ' + eGrn.message); return; }
      const isRecount = grnRow.status === 'posted';

      const rows = localCountedLines.map(l => ({
        grn_id: selectedDetailGrn, material_id: l.material_id, counted_quantity: l.qty, entry_method: l.method, entered_by: me.id
      }));
      const { error: e1 } = await sb.from('grn_counted_lines').insert(rows);
      if(e1){ alert('Could not save lines: ' + e1.message); return; }

      const rpcName = isRecount ? 'submit_recount' : 'submit_grn_details';
      const rpcParams = isRecount
        ? { p_grn_id: selectedDetailGrn, p_submitter_id: me.id }
        : { p_grn_id: selectedDetailGrn, p_submitter_id: me.id };
      const { error: e2 } = await sb.rpc(rpcName, rpcParams);
      if(e2){ alert('Lines saved, but submit failed: ' + e2.message + ' — try Submit again, your lines are safe.'); return; }

      selectedDetailGrn = null;
      localCountedLines = [];
      boySub = 'log';
      alert(isRecount ? 'Physical count submitted — an approver will reconcile it against what already posted.' : 'Submitted — now in the approval queue.');
      await renderBoy();
    } catch(err) {
      alert('Something went wrong submitting these details: ' + err.message + '. Your lines may already be saved — check History before re-entering them.');
    } finally {
      writeInFlight = false;
      if(btn){ btn.disabled = false; btn.textContent = 'Submit for Approval'; }
    }
  }

  // ---------- DISCREPANCIES ----------
  async function renderDiscrepancies(){
    const el = document.getElementById('panel-discrepancies');
    el.innerHTML = '<div class="loading">Loading…</div>';
    const { data, error } = await sb.from('variance_flags').select('*').order('flagged_at', { ascending:false });
    if(error){ el.innerHTML = `<div class="card2"><div class="empty">Could not load discrepancies: ${error.message}</div></div>`; return; }
    let flags = data || [];

    // variance_flags stores grn_id, not vendor_id directly — resolve vendor
    // through the GRN it belongs to, only fetching the rows actually needed.
    const grnIds = Array.from(new Set(flags.map(f => f.grn_id)));
    let grnVendorMap = {};
    if(grnIds.length){
      const { data: grns, error: e2 } = await sb.from('grn').select('id, vendor_id').in('id', grnIds);
      if(e2){ el.innerHTML = `<div class="card2"><div class="empty">Could not resolve vendors: ${e2.message}</div></div>`; return; }
      (grns||[]).forEach(g => { grnVendorMap[g.id] = g.vendor_id; });
    }
    function flagVendorName(f){ return vendorName(grnVendorMap[f.grn_id]); }

    if(discFilter==='open') flags = flags.filter(f => f.status==='open');
    if(discFilter==='resolved') flags = flags.filter(f => f.status!=='open');

    el.innerHTML = `
      <div class="card2">
        <h3>Discrepancy Register</h3>
        <div class="filter-row">
          <span class="fchip ${discFilter==='all'?'active':''}" onclick="discFilter='all'; renderDiscrepancies();">All</span>
          <span class="fchip ${discFilter==='open'?'active':''}" onclick="discFilter='open'; renderDiscrepancies();">Open</span>
          <span class="fchip ${discFilter==='resolved'?'active':''}" onclick="discFilter='resolved'; renderDiscrepancies();">Resolved</span>
        </div>
        ${flags.length===0 ? '<div class="empty">Nothing here.</div>' : flags.map(f => `
          <div class="list-item">
            <div class="top"><b>${flagVendorName(f)} · ${keyOf(f)}</b><span class="badge ${f.status==='open'?'open':'resolved'}">${f.status}</span></div>
            <div class="meta">${f.quantity_a} to ${f.quantity_b} (${f.variance>0?'+':''}${f.variance}) · reason: ${f.reason||'—'} · ${fmtDate(f.flagged_at)} · flagged by ${userName(f.flagged_by)}</div>
            ${f.status!=='open' ? `<div class="meta">Resolved by ${userName(f.resolved_by)} · ${f.resolution_notes||''}</div>` : `<button class="btn btn-secondary btn-sm" style="margin-top:6px;" onclick="resolveDiscrepancy('${f.id}')">Resolve</button>`}
          </div>
        `).join('')}
      </div>
    `;
  }

  async function resolveDiscrepancy(id){
    const notes = prompt('Resolution notes (e.g. vendor credited on next delivery, confirmed miscount and adjusted):');
    if(notes === null) return;
    if(!notes.trim()){ alert('Enter a note explaining how this was resolved'); return; }
    const { error } = await sb.from('variance_flags').update({
      status: 'resolved', resolution_notes: notes.trim(), resolved_by: me.id, resolved_at: new Date().toISOString()
    }).eq('id', id);
    if(error){ alert('Could not resolve: ' + error.message); return; }
    await renderDiscrepancies();
  }

  async function saveReceivingBreakdown(grnId, targetTotal){
    const lines = [];
    document.querySelectorAll('#breakdownRows .dyn-row').forEach(row => {
      const code = row.querySelector('.br-code').value.trim().toUpperCase();
      const qty = Number(row.querySelector('.br-qty').value);
      if(code && qty > 0) lines.push({ base_item_code: code, quantity: qty });
    });
    if(lines.length === 0){ alert('Add at least one SKU + qty'); return; }

    const knownCodes = new Set(refData.materials.filter(m => m.category === 'stock').map(m => m.base_item_code));
    const unknownCodes = Array.from(new Set(lines.map(l => l.base_item_code).filter(c => !knownCodes.has(c))));
    if(unknownCodes.length){ alert('Not a known SKU — check for a typo: ' + unknownCodes.join(', ')); return; }

    const sum = lines.reduce((s,l) => s + l.quantity, 0);
    if(sum !== targetTotal){ alert('Your breakdown totals ' + sum + ', but the boy reported ' + targetTotal + '. These must match exactly before saving.'); return; }

    if(writeInFlight) return;
    writeInFlight = true;
    const btn = document.getElementById('saveBreakdownBtn');
    if(btn){ btn.disabled = true; btn.textContent = 'Saving…'; }
    try{
      const { error } = await sb.rpc('submit_receiving_breakdown', { p_grn_id: grnId, p_submitter_id: me.id, p_lines: lines });
      if(error){ alert('Could not save breakdown: ' + error.message); return; }
      alert('Breakdown saved — you can now approve this delivery.');
      await openApprovalDetail(grnId);
    } catch(err) {
      alert('Something went wrong: ' + err.message);
    } finally {
      writeInFlight = false;
      if(btn){ btn.disabled = false; btn.textContent = 'Save Breakdown'; }
    }
  }

  // ---------- MODE B: normal approve/reject (breakdown already entered, or materials) ----------
  async function renderNormalApprovalDetail(grn, photoHtml){
    const grnId = grn.id;
    const required = await getRequiredApprovals(grn.grn_type, grn.vendor_id);
    const { count: done } = await sb.from('grn_approvals').select('*', { count:'exact', head:true }).eq('grn_id', grnId).eq('cycle', grn.submission_cycle).eq('action','approved');
    const nextStep = (done||0) + 1;
    const isFinal = nextStep >= required;
    const sameUser = me.id === grn.created_by || me.id === grn.details_entered_by;

    let breakdownHtml = '';
    if(grn.grn_type === 'stock'){
      const { data: lines } = await sb.from('grn_receiving_lines').select('base_item_code, quantity').eq('grn_id', grnId);
      breakdownHtml = `<h4>SKU Breakdown (from photo)</h4><div class="table-scroll"><table><tr><th>Code</th><th>Qty</th></tr>${(lines||[]).map(l=>`<tr><td>${l.base_item_code}</td><td>${l.quantity}</td></tr>`).join('')}</table></div>`;
    } else {
      const { data: lines } = await sb.from('grn_counted_lines').select('material_id, counted_quantity').eq('grn_id', grnId);
      const totals = {};
      (lines||[]).forEach(l => { totals[l.material_id] = (totals[l.material_id]||0) + Number(l.counted_quantity); });
      breakdownHtml = `<div class="table-scroll"><table><tr><th>Item</th><th>Qty</th></tr>${Object.keys(totals).map(mid => `<tr><td>${materialName(mid)}</td><td>${totals[mid]}</td></tr>`).join('')}</table></div>`;
    }

    document.getElementById('approvalDetail').innerHTML = `
      <div class="card2">
        <h3>${vendorName(grn.vendor_id)}</h3>
        <div style="font-size:11.5px; color:var(--bb-ink-muted); margin-bottom:10px;">${grn.receiving_book_ref||'no bill no'} . ${grn.grn_type} . logged by ${userName(grn.created_by)}</div>
        ${sameUser ? '<div class="list-item" style="border-color:var(--bb-rust); background:#FCF5F2;">You logged or physically counted this entry - a teammate needs to approve it, not you.</div>' : ''}
        <div class="list-item" style="cursor:default;">Approval ${nextStep} of ${required}${isFinal ? ' - this click posts to the ledger' : ' - one more approval needed after this'}</div>
        ${photoHtml}
        ${breakdownHtml}
        <div style="display:flex; gap:8px; margin-top:12px;">
          <button class="btn" style="background:transparent; border:1.5px solid var(--bb-rust); color:var(--bb-rust);" onclick="rejectGrnLive('${grnId}')">Reject</button>
          <button class="btn" style="background:var(--bb-sage); color:#fff;" ${sameUser?'disabled style="opacity:0.5;"':''} id="approveBtn" onclick="approveGrnLive('${grnId}')">${isFinal ? 'Approve and Post to Ledger' : 'Record Approval '+nextStep+' of '+required}</button>
        </div>
      </div>
    `;
  }

  async function approveGrnLive(grnId){
    if(writeInFlight) return;
    writeInFlight = true;
    const btn = document.getElementById('approveBtn');
    if(btn){ btn.disabled = true; btn.textContent = 'Working...'; }
    try{
      const { data, error } = await sb.rpc('approve_grn', { p_grn_id: grnId, p_approver_id: me.id, p_reasons: {} });
      if(error){ alert('Could not approve: ' + error.message); return; }
      alert(data.status === 'posted' ? 'Posted to ledger.' : 'Approval recorded (' + data.approvals_done + '/' + data.approvals_required + ').');
      selectedApprovalGrn = null;
      await renderApprover();
    } catch(err) {
      alert('Something went wrong: ' + err.message);
    } finally {
      writeInFlight = false;
    }
  }

  // ---------- MODE C: reconciling the later physical recount against what already posted ----------
  async function renderReconciliationDetail(grn, photoHtml){
    const grnId = grn.id;
    const { data: rows } = await sb.from('grn_receiving_vs_scanned_v').select('*').eq('grn_id', grnId);
    const sameUser = me.id === grn.details_entered_by;

    const varianceHtml = `
      <h4>Posted Book vs. Physical Recount</h4>
      <div class="table-scroll"><table><tr><th>Code</th><th>Book</th><th>Recounted</th><th>Δ</th><th>Reason</th></tr>
      ${(rows||[]).map(r => `
        <tr><td>${r.base_item_code}</td><td>${r.receiving_total}</td><td>${r.counted_total}</td>
          <td class="variance ${Number(r.variance)===0?'zero':'nonzero'}">${r.variance>0?'+':''}${r.variance}</td>
          <td>${Number(r.variance)!==0 ? `<select data-reason-key="${r.base_item_code}" style="margin-bottom:0; padding:5px;">
              <option value="">-- Select --</option>
              <option value="miscount">Miscount</option>
              <option value="picked_before_count">Picked before count</option>
              <option value="wrong_labeling">Code mix-up</option>
              <option value="other">Other</option>
            </select>` : '-'}</td></tr>`).join('')}
      </table></div>
    `;

    document.getElementById('approvalDetail').innerHTML = `
      <div class="card2">
        <h3>${vendorName(grn.vendor_id)} — Reconciliation</h3>
        <div style="font-size:11.5px; color:var(--bb-ink-muted); margin-bottom:10px;">${grn.receiving_book_ref||'no bill no'} . already posted . recounted by ${userName(grn.details_entered_by)}</div>
        ${sameUser ? '<div class="list-item" style="border-color:var(--bb-rust); background:#FCF5F2;">You did the physical recount — a teammate needs to reconcile it, not you.</div>' : ''}
        <div class="list-item" style="cursor:default;">This only ever creates variance flags for a mismatch — the Ledger is already posted and will not change here.</div>
        ${photoHtml}
        ${varianceHtml}
        <button class="btn btn-primary btn-block" ${sameUser?'disabled style="opacity:0.5;"':''} id="reconcileBtn" onclick="reconcileRecountLive('${grnId}')" style="margin-top:12px;">Reconcile</button>
      </div>
    `;
  }

  async function reconcileRecountLive(grnId){
    if(writeInFlight) return;
    writeInFlight = true;
    const btn = document.getElementById('reconcileBtn');
    if(btn){ btn.disabled = true; btn.textContent = 'Working...'; }
    try{
      const reasonSelects = document.querySelectorAll('[data-reason-key]');
      const reasons = {};
      let missing = false;
      reasonSelects.forEach(sel => { if(!sel.value){ missing = true; } reasons[sel.dataset.reasonKey] = sel.value; });
      if(missing){ alert('Pick a reason for each flagged code first'); return; }

      const { data, error } = await sb.rpc('reconcile_recount', { p_grn_id: grnId, p_reconciler_id: me.id, p_reasons: reasons });
      if(error){ alert('Could not reconcile: ' + error.message); return; }
      alert(data.flags_raised > 0 ? ('Reconciled — ' + data.flags_raised + ' variance flag(s) raised.') : 'Reconciled — clean, no differences.');
      selectedApprovalGrn = null;
      await renderApprover();
    } catch(err) {
      alert('Something went wrong: ' + err.message);
    } finally {
      writeInFlight = false;
    }
  }

  async function rejectGrnLive(grnId){
    if(writeInFlight) return;
    const reason = prompt('Reason for rejection (the warehouse boy will see this):');
    if(reason === null) return;
    writeInFlight = true;
    try{
      const { error } = await sb.rpc('reject_grn', { p_grn_id: grnId, p_actor_id: me.id, p_reason: reason });
      if(error){ alert('Could not reject: ' + error.message); return; }
      alert('Sent back for the SKU breakdown to be redone.');
      selectedApprovalGrn = null;
      await renderApprover();
    } catch(err) {
      alert('Something went wrong: ' + err.message);
    } finally {
      writeInFlight = false;
    }
  }

  async function addApprovalRule(){

    let query = sb.from('approval_matrix').select('step_number').eq('applies_to', appliesTo).eq('active', true);

      applies_to: appliesTo, vendor_id: vendorId, step_number: nextStep, approver_user_id: approverId
    });
    if(error){ alert('Could not add rule: ' + error.message); return; }
    await renderAdmin();
  }

  // ---------- EXPORTS ----------
  // ---------- TEAM ACTIVITY ----------
  let teamFilters = { fromDate:'', toDate:'' };

  function summarizeAuditEntry(row){
    const who = row.actor_user_id ? userName(row.actor_user_id) : 'System';
    const after = row.after_state || {};
    switch(row.action){
      case 'grn_logged':
        return `${who} logged a delivery from ${vendorName(after.vendor_id)}${after.receiving_book_ref ? ' ('+after.receiving_book_ref+')' : ''}`;
      case 'details_submitted':
        return `${who} submitted counted details for approval`;
      case 'approved':
        return `${who} approved a delivery (step ${after.step||'?'} of ${after.of||'?'})`;
      case 'posted_to_ledger':
        return `${who} posted a ${after.grn_type||''} delivery to the ledger`;
      case 'rejected':
        return `${who} rejected a delivery${after.reason ? ': '+after.reason : ''}`;
      case 'vendors_insert':
        return `${who} added vendor "${after.name}" (${after.category})`;
      case 'vendors_update':
        return `${who} updated vendor "${after.name}"${after.active===false ? ' — deactivated' : ''}`;
      case 'materials_insert':
        return `${who} added ${after.category==='stock' ? 'stock SKU' : 'material type'} "${after.sku || after.name}"`;
      case 'materials_update':
        return `${who} updated "${after.sku || after.name}"${after.active===false ? ' — deactivated' : ''}`;
      case 'approval_matrix_insert':
        return `${who} added an approval rule (step ${after.step_number}, ${after.applies_to})`;
      case 'approval_matrix_update':
        return `${who} changed an approval rule${after.active===false ? ' — deactivated' : ''}`;
      case 'payments_insert':
        return `${who} recorded a payment of ${after.amount} to ${vendorName(after.vendor_id)}`;
      default:
        return `${who} — ${row.action} on ${row.table_name}`;
    }
  }

  async function generateDayWiseExport(){
    const dateInput = document.getElementById('exportDate').value;
    if(!dateInput){ alert('Pick a date'); return; }
    const btn = document.getElementById('exportBtn');
    if(btn){ btn.disabled = true; btn.textContent = 'Building file…'; }
    try{
      const dayStart = dateInput + 'T00:00:00';
      const dayEnd = dateInput + 'T23:59:59';

      const { data: lines, error } = await sb.from('grn_counted_lines')
        .select('material_id, counted_quantity, entered_at')
        .gte('entered_at', dayStart)
        .lte('entered_at', dayEnd);
      if(error){ alert('Could not load: ' + error.message); return; }
      if(!lines || lines.length === 0){ alert('No detail entries found for ' + dateInput); return; }

      // Expand each line into one row per physical unit, grouped into one
      // "sheet" per base code — the exact structure the Excel upload
      // itself expects and produces, so this can be re-uploaded elsewhere
      // or archived in the same shape it originally arrived in.
      const sheetData = {};
      let totalRows = 0;
      lines.forEach(l => {
        const mat = refData.materials.find(m => m.id === l.material_id);
        if(!mat || mat.category !== 'stock') return;
        const qty = Math.round(Number(l.counted_quantity));
        if(!sheetData[mat.base_item_code]) sheetData[mat.base_item_code] = [];
        for(let i=0; i<qty; i++){ sheetData[mat.base_item_code].push([mat.sku]); totalRows++; }
      });

      if(totalRows === 0){ alert('No stock (SKU-based) entries found for ' + dateInput); return; }

      const wb = XLSX.utils.book_new();
      Object.keys(sheetData).sort().forEach(code => {
        const ws = XLSX.utils.aoa_to_sheet(sheetData[code]);
        XLSX.utils.book_append_sheet(wb, ws, code.substring(0,31));
      });
      XLSX.writeFile(wb, `counted_details_${dateInput}.xlsx`);
    } finally {
      if(btn){ btn.disabled = false; btn.textContent = 'Export This Day'; }
    }
  }
</script>
